[project]
name = "spire-server"
version = "0.1.0"
description = "SpireAV telemetry ingestion and management API (EDR-style control plane MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[project.scripts]
spire-server = "spire_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spire_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/spire_server" = "spire_server"

[tool.uv]
package = true
