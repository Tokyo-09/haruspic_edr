services:
  spire-server:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ./data:/app/data
    environment:
      SPIRE_ENROLLMENT_TOKEN: ${SPIRE_ENROLLMENT_TOKEN:?Set a random enrollment token}
      SPIRE_ADMIN_TOKEN: ${SPIRE_ADMIN_TOKEN:?Set a different random admin token}
      SPIRE_DATABASE_URL: sqlite:///./data/spire.db
      SPIRE_HOST: 0.0.0.0
      SPIRE_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    command: ["uv", "run", "--directory", "/app", "uvicorn", "spire_server.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8080"]
