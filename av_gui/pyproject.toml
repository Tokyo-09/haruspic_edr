[project]
name = "haruspic_edr_gui"
version = "0.1.0"
description = "Haruspic EDR desktop console for Linux and Windows"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.2"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
haruspic_edr_gui = "haruspic_edr_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haruspic_edr_gui"]
